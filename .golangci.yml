# Lean by intent: the standard set plus a few high-signal linters. Add a
# linter when it catches a real bug class, not because it exists.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - loggercheck
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Close on read paths and RemoveAll cleanup are ignore-by-design;
      # anywhere the error matters, it is checked explicitly.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - os.RemoveAll
    misspell:
      locale: US
    govet:
      enable-all: true
      disable:
        # fieldalignment: struct-packing micro-optimization, not worth the churn.
        - fieldalignment
        # shadow: flags the idiomatic `if err := f(); err != nil` guard
        # whenever an outer err exists.
        - shadow
  exclusions:
    rules:
      # Test scaffolding writes fixtures without ceremony; the assertions
      # that follow fail loudly if a write didn't happen.
      - path: _test\.go
        linters:
          - errcheck

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
