name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1; got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - uses: goreleaser/goreleaser-action@v7
        with:
          version-file: .tool-versions
          args: check

  check:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets: inherit

  goreleaser:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version-file: .tool-versions
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Same card release-notify.yml used to post; it lives here because the
  # release event never fires for a workflow-created release. Skips
  # silently until SLACK_DEPLOYS_WEBHOOK is set in repo secrets.
  notify:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_DEPLOYS_WEBHOOK }}
    steps:
      - name: Notify via Slack
        if: env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          MSG_MINIMAL: true
          SLACK_USERNAME: "${{ github.repository }}: release"
          SLACK_ICON: ${{ vars.SLACK_WEBHOOK_ICON_DEV }}
          SLACK_COLOR: good
          SLACK_MESSAGE: "Released <https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}|${{ github.ref_name }}> -- install: curl -fsSL https://get.openroutines.dev/install.sh | bash"
          SLACK_FOOTER: ""
