name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12

      - name: build
        run: go build ./...

      - name: test
        run: go test ./...

      - name: smoke
        run: bin/smoke
