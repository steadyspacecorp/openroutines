name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow reuses this as its pre-release gate.
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: gitleaks scans the commit range, not just the tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .tool-versions
          install-only: true

      - name: lint
        run: make lint

      # Without this the action picks a gitleaks version of its own, which
      # drifts from the one `make check-secrets` runs locally.
      - name: gitleaks version
        run: awk '/^gitleaks /{print "GITLEAKS_VERSION="$2}' .tool-versions >> "$GITHUB_ENV"

      - name: secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: check
        run: make check

      # The runner restricts unprivileged user namespaces through AppArmor,
      # on the runner itself and equally inside Docker, where no
      # --security-opt lifts it. Left alone, CI would cover no bubblewrap rung
      # at all -- so lift it, which is exactly what docs/operating.md tells an
      # operator to do on such a host.
      - name: bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: permit unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # REQUIRE_SANDBOX turns "no sandbox here" from a skip into a failure, so
      # losing host-side coverage of every rung is a red build rather than a
      # quiet lapse in coverage of the boundary production depends on.
      - name: test
        run: make test-race
        env:
          OPENROUTINES_REQUIRE_SANDBOX: 1

      - name: smoke
        run: make smoke

  # Same pattern as the org's other repos: the rtCamp default card into the
  # CI channel. Skips silently until SLACK_CI_WEBHOOK is set in repo secrets.
  notify:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_CI_WEBHOOK }}
    steps:
      - name: Notify via Slack
        if: env.SLACK_WEBHOOK != ''
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_USERNAME: "${{ github.repository }}: ${{ needs.ci.result }}"
          SLACK_ICON: ${{ vars.SLACK_WEBHOOK_ICON_DEV }}
          SLACK_COLOR: ${{ needs.ci.result }}
          SLACK_FOOTER: ""
